name: Client release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag of your choice (for example v0.0.4); created automatically if missing'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read unified client version and build commit
        id: version
        run: |
          node scripts/client-release-config.cjs >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate Android version and expected signing certificate
        id: android
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then echo "Missing release setting: $name"; exit 1; fi
          done
          node mobile/scripts/android-release.cjs --metadata >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK matching React Native 0.88
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Generate Android native project from Expo config
        run: npx --no-install expo prebuild --platform android --clean --no-install
      - name: Build unsigned ARM64 release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
      - name: Sign APK with existing Android release key and verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then echo "Missing release setting: $name"; exit 1; fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/go-bot-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          node scripts/android-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: mobile/out/release/android-arm64/*
          if-no-files-found: error
      - name: Remove temporary Android signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/go-bot-android-release.jks"

  macos:
    needs: prepare
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Import release credentials into an isolated keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.MACOS_NOTARY_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_TEAM_ID APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then echo "Missing release setting: $name"; exit 1; fi
          done
          umask 077
          keychain="$RUNNER_TEMP/go-bot-release.keychain-db"
          certificate="$RUNNER_TEMP/go-bot-release.p12"
          api_key="$RUNNER_TEMP/go-bot-notary.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          curl --fail --silent --show-error --location --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/go-bot-intermediate.cer"
          security import "$RUNNER_TEMP/go-bot-intermediate.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          {
            echo "APPLE_SIGNING_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY=$api_key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Sign, notarize, create DMG and verify installed app
        run: npm run release:mac -- ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: desktop/out/release/macos-${{ matrix.arch }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-macos-${{ matrix.arch }}
          path: |
            desktop/test-results/**
            desktop/out/notarization/**/*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-dmg-${{ matrix.arch }}
          path: desktop/out/notarization/**/*.dmg
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/go-bot-release.keychain-db" 2>/dev/null || true
          rm -f -- "$RUNNER_TEMP/go-bot-release.p12" "$RUNNER_TEMP/go-bot-notary.p8" "$RUNNER_TEMP/go-bot-intermediate.cer"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Native and video smoke tests
        run: |
          node scripts/smoke.cjs
          node scripts/video-smoke.cjs
      - name: Make unsigned Windows installer
        run: npm run make -- --platform=win32 --arch=x64
      - name: Collect Windows installer (no signing credentials)
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installers = @(Get-ChildItem out/make -Recurse -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $status = (Get-AuthenticodeSignature -LiteralPath $installers[0].FullName).Status
          if ($status -ne 'NotSigned') { throw "Unexpected installer signing status: $status" }
          New-Item -ItemType Directory -Force out/release/windows-x64 | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "out/release/windows-x64/go-bot-${env:RELEASE_VERSION}-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: desktop/out/release/windows-x64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-windows-x64
          path: desktop/test-results/**
          if-no-files-found: ignore

  draft-release:
    needs: [prepare, macos, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate artifact set and generate checksums and release notes
        run: node desktop/scripts/collect-desktop-release.cjs release-artifacts
      - name: Create or update draft only
        run: bash scripts/publish-client-release.sh
