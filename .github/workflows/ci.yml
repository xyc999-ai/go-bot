name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Go, Web, mobile and Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - name: Prepare the Cordis runtime and plugin SDK
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.25.0
          pnpm --dir extensions/cordis install --frozen-lockfile --ignore-scripts
          pnpm --dir extensions/sdk install --frozen-lockfile --ignore-scripts
          npm --prefix extensions/plugins/x ci --ignore-scripts --no-audit --no-fund
          npm --prefix extensions/plugins/gemini-api ci --ignore-scripts --no-audit --no-fund
      - name: Test the Cordis runtime and plugin SDK
        run: |
          pnpm --dir extensions/cordis test
          pnpm --dir extensions/sdk test

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test Go packages
        run: make test vet check
      - name: Check for data races
        if: github.event_name == 'workflow_dispatch'
        run: make race

      - name: Build and test Web
        run: |
          make build-web
          npm --prefix frontend test
      - name: Type-check mobile
        run: |
          npm --prefix mobile ci
          npm --prefix mobile run typecheck

      - name: Build and smoke-test the Host image
        run: |
          make image
          ./scripts/smoke-image.sh
      - name: Smoke-test the web chat on Docker
        if: github.event_name != 'workflow_dispatch'
        run: RUN_DOCKER_INTEGRATION=1 go test -tags webui ./tests/integration -run '^TestDockerWebChatPreview$' -v
      - name: Run the full Docker integration suite
        if: github.event_name == 'workflow_dispatch'
        run: RUN_DOCKER_INTEGRATION=1 go test -tags webui ./tests/integration -v
      - name: Smoke-test Controller, Redis and Hosts with Docker Compose
        run: |
          make image-controller
          python3 scripts/test-install.py
          python3 scripts/smoke-cli.py
