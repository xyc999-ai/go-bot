name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke test Electron on macOS and Windows
        run: |
          node scripts/smoke.cjs
          node scripts/video-smoke.cjs
      - name: Make platform packages
        run: npm run make
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/make/**
            desktop/test-results/**
          if-no-files-found: ignore
