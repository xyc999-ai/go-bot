openapi: 3.0.3
info:
  title: Go Bot HTTP API
  version: 0.1.0
  description: The local Controller selects an account through X-User-ID.
    Direct Host requests use the internal Host token instead.
servers:
- url: http://127.0.0.1:8080
paths:
  /assets/plugins/{pluginId}/{file}:
    get:
      summary: Read a catalog plugin image declared in plugin.json
      parameters:
        - {name: pluginId, in: path, required: true, schema: {type: string}}
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Public plugin image; no running Host is required
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: Image not found}
  /v1/host/extensions/authorization:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    get:
      tags: [Extensions]
      summary: List plugin authorization flows without other clients' interaction details
      operationId: listPluginAuthorization
      responses:
        '200':
          description: Registered methods, in-flight state and account configuration reported by the native integration or Go credential store
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuthorizationEntry'}}
        '409': {description: Host is not running}
        '503': {description: Plugin runtime is not running}
    delete:
      tags: [Extensions]
      summary: Cancel a key's active attempt even when its initiating page has closed
      operationId: cancelPluginAuthorizationKey
      description: Uses the original cancel(key) seam. No interaction details from another surface are returned; an admitted commit finishes before settlement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string}
      responses:
        '200':
          description: Settlement or a no-op when no attempt is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [authorized, cancelled, failed]}
    post:
      tags: [Extensions]
      summary: Start an explicit authorization using the bundled client's own interaction surface
      operationId: startPluginAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              additionalProperties: false
              properties:
                key: {type: string, description: CredentialKey of the registered flow}
                method: {type: string, description: Defaults to the first declared method}
      responses:
        '202':
          description: An admitted attempt; this response is not an authorization success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAttempt'}
        '404': {description: No such registered flow}
        '409': {description: Host unavailable or this key already has an active attempt}
        '422': {description: Invalid method or key}
  /v1/host/extensions/authorization/disconnect:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    post:
      tags: [Extensions]
      summary: Disconnect an account using the integration's native logout
      operationId: disconnectPluginAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: {type: string}
      responses:
        '200':
          description: Native account is no longer configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean}
                  accountLabel: {type: string}
        '409': {description: Host unavailable or another authorization operation is in progress}
        '404': {description: No registered disconnect operation for this account}
        '422': {description: The native account is still configured}
  /v1/host/extensions/authorization/{attemptId}:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Extensions]
      summary: Read notices and unanswered prompts using the initiating surface's transient handle
      operationId: getPluginAuthorization
      responses:
        '200':
          description: Current attempt; never contains entered answers or credential values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAttempt'}
        '404': {description: Unknown handle or runtime restarted}
        '409': {description: Host is not running}
    delete:
      tags: [Extensions]
      summary: Withdraw this attempt and wait for its authorization outcome
      operationId: cancelPluginAuthorization
      description: An admitted record commit finishes. Cancellation does not remove an earlier credential record. There is no framework-wide timeout.
      responses:
        '200':
          description: Settled outcome, including authorized when a commit was already admitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAttempt'}
        '404': {description: Unknown handle or runtime restarted}
  /v1/host/extensions/authorization/{attemptId}/answer:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - {name: attemptId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Extensions]
      summary: Answer or decline one prompt in this authorization
      operationId: answerPluginAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [promptId]
              additionalProperties: false
              properties:
                promptId: {type: string, format: uuid}
                answer: {type: string, maxLength: 16384, description: Sent only to the waiting flow; never echoed or stored by Controller}
                decline: {type: boolean, description: Reject this prompt with the original AuthorizationDeclinedError}
      responses:
        '200':
          description: Updated interaction; the flow can continue asynchronously
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationAttempt'}
        '404': {description: Unknown attempt or prompt no longer pending}
        '422': {description: Invalid answer or unoffered select option}
  /v1/host/mcp:
    get:
      tags: [Extensions]
      summary: Plugin-owned MCP runtime diagnostics; configured through the owning plugin
      operationId: getMCPStatus
      parameters:
        - {$ref: '#/components/parameters/AccountName'}
      responses:
        '200':
          description: Actual Host connection state without independent account settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPView'}
  /v1/host/mcp/servers/{name}/restart:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
    post:
      summary: Reconnect a managed MCP server after completing prior cleanup
      operationId: restartMCPServer
      responses:
        '200':
          description: Actual state after the initial reconnect attempt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPView'}
        '409': {description: Host is not running}
        '502': {description: Restart failed}
  /v1/host/mcp/servers/{name}/probe:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
    post:
      summary: Inspect and close a temporary MCP connection without publishing tools
      operationId: probeMCPServer
      responses:
        '200':
          description: Temporary probe state, independent of the managed server state. OAuth never starts implicitly.
          content:
            application/json:
              schema:
                type: object
                required: [name, source, state, toolCount, resources]
                properties:
                  name: {type: string}
                  source: {type: string, enum: [user, plugin]}
                  owner: {type: string}
                  state: {type: string, enum: [connected, failed, waiting-credentials, waiting-authorization, stopping]}
                  error: {type: string}
                  missing: {type: array, items: {type: string}}
                  toolCount: {type: integer, minimum: 0}
                  resources: {type: boolean}
                  protocolVersion: {type: string}
                  serverName: {type: string}
                  oauthEnabled: {type: boolean, description: The plugin declared standard MCP OAuth for this connection.}
        '409': {description: Host is not running}
        '502': {description: Host probe request or cleanup failed}
  /v1/host/mcp/servers/{name}/authorize:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
    post:
      summary: Start an explicit MCP OAuth authorization-code flow with PKCE
      operationId: authorizeMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                  description: Visible Controller origin; must match the actual request Host. HTTPS or loopback HTTP only. Forwarded destination headers are not trusted.
      responses:
        '200':
          description: Authorization URL is ready, or the attempt completed without further browser interaction.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPOAuthAuthorization'}
        '400': {description: Invalid origin or callback requirements}
        '409': {description: Host is not running}
        '502': {description: Authorization preparation failed}
  /v1/host/mcp/servers/{name}/authorization:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
    delete:
      summary: Cancel a pending browser authorization without deleting an existing grant
      operationId: cancelMCPAuthorization
      parameters:
      - name: id
        in: query
        schema: {type: string, maxLength: 128}
        description: Select this attempt only; stale identities are ignored. Omission cancels the current attempt.
      responses:
        '200':
          description: Attempt cleanup completed; saved credentials remain independent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPView'}
        '409': {description: Host is not running}
        '502': {description: Authorization cleanup failed}
  /v1/host/mcp/servers/{name}/grant:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,32}$'}
    delete:
      summary: Disconnect MCP and remove its local OAuth grant
      operationId: disconnectMCPOAuth
      responses:
        '200':
          description: Connection stopped and local grant removed; no remote provider revocation is implied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MCPView'}
        '409': {description: Host is not running}
        '502': {description: Local cleanup or grant deletion failed}
  /v1/mcp/oauth/callback/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema: {type: string}
    - name: state
      in: query
      required: true
      schema: {type: string}
    - name: code
      in: query
      schema: {type: string}
    - name: iss
      in: query
      schema: {type: string}
    - name: error
      in: query
      schema: {type: string}
    get:
      summary: Forward a browser callback to the already-running account Host for one-time state validation
      operationId: completeMCPOAuthCallback
      description: No X-User-ID header is required. Only this callback is exempted from browser-origin checks. A stopped Host is never started by the callback.
      responses:
        '200':
          description: Fixed confirmation page, or a request to continue additional provider authorization in Go Bot. Does not echo codes, tokens or state.
          content:
            text/html:
              schema: {type: string}
        '400': {description: Invalid, expired, replayed or failed authorization}
        '404': {description: Account unavailable}
        '409': {description: Host is not running}
  /v1/plugins/authorization/callback/{userId}/{token}:
    get:
      tags: [Extensions]
      summary: Receive a single-use browser callback for an active plugin authorization
      operationId: receivePluginAuthorizationCallback
      parameters:
      - {in: path, name: userId, required: true, schema: {type: string}}
      - {in: path, name: token, required: true, schema: {type: string, format: uuid}}
      - {in: query, name: state, required: true, schema: {type: string}}
      description: Provider query parameters are forwarded privately to the current flow. Receipt does not mean authorization succeeded. This endpoint does not require X-User-ID and never starts a Host.
      responses:
        '200':
          description: Callback received; return to the app for the actual authorization outcome.
          content:
            text/html:
              schema: {type: string}
        '400': {description: Invalid, expired, replayed or rejected callback}
        '409': {description: The account has no running Host}
  /v1/settings/plugins:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    get:
      summary: Saved plugin settings and actual Host runtime state
      operationId: getPluginSettings
      responses:
        '200':
          description: Credential values are never returned; a stopped Host reports unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
  /v1/settings/plugins/packages:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    post:
      summary: Install a reviewed plugin and its dependencies; initially disabled
      operationId: installPluginPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPackageInput'}
      responses:
        '200':
          description: Package and approved native installation scripts completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        '409': {description: Host is stopped or package is already configured}
        '422': {description: Package preparation failed}
        '502': {description: Intent was saved but the Host could not confirm application}
  /v1/settings/plugins/packages/{name}:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - {in: path, name: name, required: true, schema: {type: string}, description: URL-encode the complete npm package name as one segment.}
    put:
      summary: Enable or disable an installed plugin package
      operationId: setPluginEnabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Saved selection and actual Host status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        '400': {description: Invalid input}
        '404': {description: Plugin is not installed}
        '502': {description: Selection saved but activation failed}
    delete:
      summary: Remove package intent and stop its code before uninstalling
      operationId: removePluginPackage
      responses:
        '200':
          description: Credentials and workspace data are retained.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        '404': {description: Package not configured}
        '409': {description: Host is not running}
        '502': {description: Intent was saved but Host removal failed}
  /v1/settings/plugins/packages/{name}/update:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    - {in: path, name: name, required: true, schema: {type: string}}
    post:
      summary: Prepare and explicitly apply a new package version
      operationId: updatePluginPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PluginPackageInput'}
      responses:
        '200':
          description: Actual state after applying the new saved source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        '404': {description: Package not configured}
        '409': {description: Host is not running}
        '502': {description: New intent was saved but application failed}
  /v1/host/plugins/runtime/restart:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    post:
      summary: Apply saved intent and restart the Host extension process
      operationId: restartPlugins
      responses:
        '200':
          description: Actual state after cleanup and restart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PluginView'}
        '409': {description: Host is not running}
        '502': {description: Application or restart failed}
  /v1/settings/proactive:
    parameters:
    - $ref: '#/components/parameters/AccountName'
    get:
      summary: Read proactive assistance preference and Host status without starting a Host
      operationId: getProactiveSettings
      responses:
        '200':
          description: Account preference and current Host status, timestamps in Unix milliseconds
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProactiveStatus'}
        '404': {description: Account not found}
    put:
      summary: Save the proactive assistance preference and apply it to a running Host
      operationId: saveProactiveSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200':
          description: Saved preference and current Host status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProactiveStatus'}
        '400': {description: Invalid settings}
        '404': {description: Account not found}
        '409': {description: model_not_configured or model_selection_unavailable; enabling rejected before saving the preference}
        '503': {description: Storage unavailable or settings_saved_host_apply_failed after a successful Redis save}
  /healthz:
    get:
      summary: Process liveness
      operationId: get__healthz
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
  /readyz:
    get:
      summary: Application readiness
      operationId: get__readyz
      responses:
        '200':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
  /v1/capabilities:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Current Host capabilities
      operationId: get__v1_capabilities
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: &id001
                type: object
                additionalProperties: true
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
  /v1/accounts:
    post:
      summary: Create an account by name
      operationId: post__v1_accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId:
                    type: string
        '400':
          description: Invalid account name
        '409':
          description: Account already exists
        '503':
          description: Account store unavailable
  /v1/settings/models:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read the model catalog with redacted credentials
      responses:
        '200':
          description: Catalog containing defaultEndpointId and endpoints keyed by ID
        '404': {description: Account not found}
  /v1/settings/models/endpoints:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Add an OpenAI-compatible Responses endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/ModelEndpointInput"
              - type: object
                required: [name, baseUrl, apiKey, models]
      responses:
        '201': {description: Endpoint saved, returning endpointId and status}
        '503': {description: Settings could not be saved or the running Host could not apply them}
        '400': {description: Invalid model endpoint}
  /v1/settings/models/endpoints/{endpointId}:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - name: endpointId
      in: path
      required: true
      schema: {type: string, format: uuid}
    patch:
      summary: Edit supplied endpoint fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelEndpointInput"
      responses:
        '200': {description: Endpoint updated}
        '503': {description: Settings could not be saved or the running Host could not apply them}
        '400': {description: Invalid endpoint or API key missing for a new origin}
        '404': {description: Endpoint not found}
    delete:
      summary: Remove an endpoint and clear it if it was the default
      responses:
        '200': {description: Endpoint removed}
        '503': {description: Settings could not be saved or the running Host could not apply them}
        '404': {description: Endpoint not found}
  /v1/settings/models/default:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    put:
      summary: Change the default endpoint for new sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId]
              properties:
                endpointId:
                  type: string
                  description: Endpoint ID, or an empty string to clear the default
      responses:
        '200': {description: Default saved}
        '503': {description: Settings could not be saved or the running Host could not apply them}
        '400': {description: Invalid endpoint}
  /v1/host:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Controller runtime state
      operationId: get__v1_host
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
  /v1/host/schedules:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read the Host task catalog without activating sessions
      responses:
        '200':
          description: Active tasks first, followed by paused and ended tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: {$ref: "#/components/schemas/ScheduleEntry"}
        '503': {description: Host or Schedule unavailable}
    post:
      summary: Create a scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, prompt, timing]
              properties:
                title: {type: string, maxLength: 120}
                prompt: {type: string}
                timing: {$ref: "#/components/schemas/ScheduleTiming"}
                target: {$ref: "#/components/schemas/ScheduleTarget"}
      responses:
        '201':
          description: Task stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleEntry"}
        '400': {description: Invalid rule or destination}
  /v1/host/schedules/list:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: List a page from the Host task catalog
      parameters:
      - {name: active, in: query, schema: {type: boolean}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: Page with items, shown, total, limit and offset}
        '400': {description: Invalid page options}
  /v1/host/schedules/limits:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read the per-task delivery interval for tasks that always create a new session
      responses:
        '200': {description: newSessionIntervalSeconds in seconds}
  /v1/host/schedules/ended:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    delete:
      summary: Remove all ended tasks and their delivery histories
      responses:
        '200': {description: Count of deleted tasks}
  /v1/host/stream:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - $ref: "#/components/parameters/ControllerOrigin"
    get:
      summary: Stream all account session updates and task catalog changes over one SSE connection
      parameters:
      - name: cursors
        in: query
        description: URL-encoded JSON object mapping up to 20 cached session IDs to their last durable sequence or null
        schema: {type: string, maxLength: 8192}
      responses:
        '200':
          description: "event: host records containing sessionId (for session events), type and data; connection restores pending interactions"
          content:
            text/event-stream:
              schema: {type: string}
        '400': {description: Invalid session cursor map}
        '503': {description: Host unavailable}
  /v1/host/schedules/stream:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Invalidate a cached task catalog when task data or execution activity changes
      responses:
        '200':
          description: schedule/changed events
          content:
            text/event-stream:
              schema: {type: string}
  /v1/host/schedules/{scheduleId}:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - &scheduleId {name: scheduleId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read a task by ID
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleEntry"}
        '404': {description: Task missing}
    patch:
      summary: Edit or delete a scheduled task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [update, delete]}
                expectedUpdatedAt: {type: string, format: date-time, nullable: true}
                patch:
                  type: object
                  properties:
                    title: {type: string, maxLength: 120}
                    prompt: {type: string}
                    target: {$ref: "#/components/schemas/ScheduleTarget"}
                    timing: {$ref: "#/components/schemas/ScheduleTiming"}
                    active: {type: boolean}
      responses:
        '200': {description: Updated task or deletion receipt}
        '400': {description: Invalid edit}
        '404': {description: Task missing}
        '409': {description: The task changed since the submitted revision}
  /v1/host/schedules/{scheduleId}/run:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - *scheduleId
    post:
      summary: Deliver a task now without advancing its next occurrence
      responses:
        '200':
          description: Task with the accepted delivery receipt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScheduleEntry"}
        '404': {description: Task missing}
        '409': {description: Execution is queued, running, or inside its minimum interval}
  /v1/host/schedules/{scheduleId}/history:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - *scheduleId
    get:
      summary: Read durable deliveries without activating their sessions
      parameters:
      - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      - {name: before, in: query, schema: {type: string}, description: Exclusive delivery message ID}
      responses:
        '200': {description: Receipts in newest-first order, retention limits and optional nextBefore cursor}
        '404': {description: Task or cursor missing}
  /v1/host/files:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: List an account Host directory
      description: Read file metadata under /root/harness without starting a session.
      parameters:
      - name: path
        in: query
        description: Relative directory path. Omit it for the root.
        schema: {type: string}
      - name: offset
        in: query
        schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Directory entries and the next offset, when available
          headers:
            X-Harness-Storage:
              schema: {type: string, enum: [docker-volume, nas, instance]}
            X-Harness-Storage-Source:
              description: Docker volume name or NAS subdirectory
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [rootPath, path, files, truncated]
                properties:
                  rootPath: {type: string, example: /root/harness}
                  path: {type: string}
                  truncated: {type: boolean}
                  nextOffset: {type: integer}
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, path, isDir, size]
                      properties:
                        name: {type: string}
                        path: {type: string}
                        isDir: {type: boolean}
                        size: {type: integer, format: int64}
        '400':
          description: Invalid directory path or offset
        '404':
          description: Account or directory not found
        '503':
          description: Host unavailable
  /v1/host/instance:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    delete:
      summary: Delete precisely owned compute, retain external data
      operationId: delete__v1_host_instance
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
        '504':
          description: Runtime operation could not be confirmed before the deadline
  /v1/hosts/{hostId}:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read an instance of the selected account
      operationId: get__v1_hosts_hostId
      parameters:
      - in: path
        name: hostId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Host state
          content:
            application/json:
              schema: *id001
        '404':
          description: Instance absent or assigned to a different account
        '503':
          description: Service unavailable
  /v1/host/start:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Start Host and prepare its stable main chat without requiring an LLM
      operationId: post__v1_host_start
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                welcomeLocale:
                  type: string
                  enum: [en, zh-CN]
                  default: en
      responses:
        '200':
          description: Core Host ready; prepare selected plugins separately
          content:
            application/json:
              schema:
                type: object
                required: [mainSessionId]
                properties:
                  mainSessionId: {type: string, format: uuid}
        '400':
          description: Invalid request
        '404':
          description: Account not found
        '503':
          description: Host or main chat preparation failed
        '504':
          description: Runtime operation could not be confirmed before the deadline
  /v1/host/plugins/prepare:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Prepare missing selected packages and apply plugin enabled state
      operationId: post__v1_host_plugins_prepare
      responses:
        '200':
          description: Plugin catalog, settings and actual runtime status
        '409':
          description: Host is not running
        '422':
          description: Plugin preparation failed; successful packages remain usable
        '503':
          description: Account settings unavailable
  /v1/host/stop:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Stop Host
      operationId: post__v1_host_stop
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
        '504':
          description: Runtime operation could not be confirmed before the deadline
  /v1/settings/web-search:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read account web search settings
      responses:
        '200':
          description: Available providers, current selection and saved settings with credentials redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '404':
          description: Account not found
    put:
      summary: Save settings or select an account web search provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: {type: string, default: deepseek, enum: [deepseek, zhipu, doubao, tavily, brave]}
                activate:
                  type: boolean
                  description: Set false to save without changing the active provider. Set true to use this provider with a saved key. Omit for legacy save-and-select behavior.
                apiKey: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '503':
          description: Settings could not be saved or the running Host could not apply them
        '400':
          description: Invalid provider settings
        '404':
          description: Account not found
    delete:
      summary: Remove the specified provider's API key
      parameters:
      - name: provider
        in: query
        schema: {type: string, default: deepseek}
      responses:
        '200':
          description: API key removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '503':
          description: Settings could not be saved or the running Host could not apply them
        '400':
          description: Unsupported provider
        '404':
          description: Account not found
  /v1/settings/image-generation:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read account image generation settings
      responses:
        '200':
          description: Available providers, current selection and saved settings with credentials redacted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '404':
          description: Account not found
    put:
      summary: Save settings or select an account image generation provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: {type: string, default: seedream, enum: [seedream, openai, nanobanana]}
                activate:
                  type: boolean
                  description: Set false to save without changing the active provider. Set true to use this provider with a saved key. Omit for legacy save-and-select behavior.
                model:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Required on initial save and legacy writes. Selection can reuse the stored model.
                apiKey: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
      responses:
        '200':
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '503':
          description: Settings could not be saved or the running Host could not apply them
        '400':
          description: Invalid provider settings
        '404':
          description: Account not found
    delete:
      summary: Remove the specified provider's API key
      parameters:
      - name: provider
        in: query
        schema: {type: string, default: seedream}
      responses:
        '200':
          description: API key removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolProviderSettings"
        '503':
          description: Settings could not be saved or the running Host could not apply them
        '400':
          description: Unsupported provider
        '404':
          description: Account not found
  /v1/sessions:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Create a top-level session
      operationId: post__v1_sessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workspaceSessionId:
                  type: string
                  format: uuid
                  description: Reuse the recorded working directory of this session.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - sessionId
                properties:
                  sessionId:
                    type: string
                    format: uuid
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: No valid account default model (model_default_required)
        '503':
          description: Service unavailable
    get:
      summary: List persisted and unarchived top-level sessions
      operationId: get__v1_sessions
      parameters:
      - name: latest
        in: query
        description: When true, return only the most recently created unarchived session, if one exists.
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [sessionId, createdAt, mode]
                      properties:
                        sessionId:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        mode:
                          type: string
                        title:
                          type: string
                        cwd:
                          type: string
                        isMain:
                          type: boolean
                          description: True for the account main chat
                  nextCursor:
                    type: string
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
  /v1/sessions/{id}:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    delete:
      summary: Archive a top-level session and retain its data on disk
      operationId: archiveSession
      parameters:
      - name: stopActivity
        in: query
        schema: {type: boolean, default: false}
        description: Stop running work and remove active schedules that deliver to this session.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session archived, including a repeated request for the same session
        '404':
          description: Session not found
        '409':
          description: Session is busy or is the destination of a pending scheduled reminder
        '503':
          description: Archive storage is unavailable
    get:
      summary: Active session state
      operationId: get__v1_sessions_id
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/sessions/{id}/model:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    - name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      summary: Read the selection and availability for one session
      responses:
        '200': {description: Session model selection and status}
        '404': {description: Session not found}
    put:
      summary: Switch this session's endpoint and model for its next turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId, modelId]
              properties:
                endpointId: {type: string, format: uuid}
                modelId: {type: string}
      responses:
        '200': {description: Session model updated}
        '503': {description: Settings could not be saved or the running Host could not apply them}
        '404': {description: Session not found}
        '409': {description: Model selection unavailable}
  /v1/sessions/{id}/messages:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Durably admit a new message
      operationId: post__v1_sessions_id_messages
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - messageId
                properties:
                  messageId:
                    type: string
                  files:
                    type: array
                    items: *id001
                  images:
                    type: array
                    items: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                  minLength: 1
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                files:
                  type: array
                  maxItems: 8
                  items:
                    type: string
                    format: binary
                images:
                  type: array
                  items:
                    type: string
                    format: binary
