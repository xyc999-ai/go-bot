        '503':
          description: Session or sandbox unavailable
  /v1/sessions/{id}/questions:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read questions
      operationId: get__v1_sessions_id_questions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /v1/sessions/{id}/goal/resume:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Resume a goal at its exact revision
      operationId: post__v1_sessions_id_goal_resume
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - goalId
              - revision
              properties:
                goalId:
                  type: string
                revision:
                  type: integer
                  minimum: 1
  /v1/sessions/{id}/questions/{callId}/answer:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Answer pending or continued questions and resolve a pending approval
      operationId: post__v1_sessions_id_questions_callId_answer
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: callId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - answers
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    properties:
                      id:
                        type: string
                      selected:
                        type: array
                        items:
                          type: string
                      custom:
                        type: string
  /v1/sessions/{id}/questions/{callId}/cancel:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    post:
      summary: Cancel a pending question
      operationId: post__v1_sessions_id_questions_callId_cancel
      responses:
        '204':
          description: Success
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: callId
        in: path
        required: true
        schema:
          type: string
  /v1/sessions/{id}/attachments/{attachmentId}:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Download an attachment referenced by this session
      operationId: get_session_attachment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
      - name: name
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Verified attachment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: No available attachment with that identity in this session
        '503':
          description: Session history unavailable
  /v1/sessions/{id}/schedules/{scheduleId}/history:
    parameters:
    - $ref: "#/components/parameters/AccountName"
    get:
      summary: Read delivery receipts
      operationId: get__v1_sessions_id_schedules_scheduleId_history
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '409':
          description: State conflict
        '503':
          description: Service unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
      - name: before
        in: query
        schema:
          type: string
components:
  parameters:
    ControllerOrigin:
      in: header
      name: X-Go-Bot-Controller-Origin
      required: false
      description: Actual Controller origin visible to the client. Must match the request Host; HTTPS or loopback HTTP enables the Host's private OAuth callback channel. Bundled clients send this automatically, including when TLS terminates at a proxy.
      schema: {type: string, format: uri, maxLength: 4096}
    AccountName:
      in: header
      name: X-User-ID
      required: true
      description: Account name on Controller requests
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
  schemas:
    ProactiveStatus:
      type: object
      required: [enabled, phase]
      properties:
        enabled: {type: boolean, default: false}
        phase: {type: string, enum: [waiting, running, waiting-for-model, waiting-for-main, disabled, host-stopped, unavailable, error]}
        nextCheckAt: {type: integer, format: int64, description: Last successful AI decision's next check, in Unix milliseconds}
        nextCheckReason: {type: string}
        lastRunStartedAt: {type: integer, format: int64}
        lastCompletedAt: {type: integer, format: int64}
        error: {type: string, description: Safe status code without credentials or model response bodies}
    AuthorizationEntry:
      type: object
      required: [key, label, methods, inFlight, configured]
      properties:
        key: {type: string}
        label: {type: string}
        methods:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, label]
            properties:
              id: {type: string}
              label: {type: string}
        inFlight: {type: boolean}
        configured: {type: boolean, description: Native integration or Go credential store reports an account; does not assert external service availability}
        canDisconnect: {type: boolean}
        accountLabel: {type: string}
        attemptId: {type: string, format: uuid, description: Latest resumable interaction handle retained by the Host surface.}
        attemptStatus: {type: string, enum: [running, authorized, cancelled, failed]}
    AuthorizationAttempt:
      type: object
      required: [id, key, label, method, status, notices, prompts]
      properties:
        id: {type: string, format: uuid, description: Transient Host interaction handle; absent from Redis and client storage}
        key: {type: string}
        label: {type: string}
        method: {type: string}
        status: {type: string, enum: [running, authorized, cancelled, failed]}
        notices:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: {type: string}
              url: {type: string}
              code: {type: string}
        prompts:
          type: array
          items:
            type: object
            required: [id, kind, message]
            properties:
              id: {type: string, format: uuid}
              kind: {type: string, enum: [text, secret, select]}
              message: {type: string}
              placeholder: {type: string}
              webInput: {type: string, enum: [json-file], description: "Optional Web file chooser hint; native clients retain the declared text/secret input."}
              options:
                type: array
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: {type: string}
                    label: {type: string}
                    description: {type: string}
        error: {type: string, description: Diagnostic with captured secret answers redacted}
    MCPServer:
      type: object
      required: [transport]
      additionalProperties: false
      description: Process and HTTP fields are mutually exclusive. Credential templates are resolved only in args, env and headers.
      properties:
        enabled: {type: boolean, default: true}
        transport: {type: string, enum: [stdio, streamable-http]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        env: {type: object, additionalProperties: {type: string}}
        cwd: {type: string, description: Absolute Host directory for stdio}
        url: {type: string, description: HTTP(S) MCP endpoint for streamable-http}
        headers: {type: object, additionalProperties: {type: string}}
        toolLoading: {type: string, enum: [eager, on-demand], default: eager}
        oauth:
          type: object
          additionalProperties: false
          description: Explicit authorization code with PKCE. Omit clientId for dynamic registration; confidential clients use a static credential reference. Grants remain private Host files.
          properties:
            clientId: {type: string}
            clientSecretRef: {type: string}
            credentialKey: {type: string}
            scope: {type: string, description: Explicit scope; omission uses the server challenge}
            requestTimeoutMs: {type: integer, minimum: 1, maximum: 2147483647, default: 10000}
            authorizationTimeoutMs: {type: integer, minimum: 1, maximum: 2147483647, default: 600000}
            scopes: {type: array, items: {type: string}}
    MCPOAuthAuthorization:
      type: object
      required: [name, state]
      properties:
        name: {type: string}
        id: {type: string, description: Opaque attempt identity; distinct from OAuth state and PKCE values}
        phase: {type: string, enum: [starting, waiting-browser, exchanging, committing, authorized, cancelled, failed]}
        state: {type: string, enum: [preparing, pending, connecting, authorized, failed, cancelled, expired]}
        url: {type: string, description: Provider authorization URL, present only while user interaction is needed}
        expiresAt: {type: integer, format: int64, description: Authorization attempt expiry in Unix milliseconds}
        error: {type: string}
    MCPView:
      type: object
      required: [status]
      properties:
        status:
          type: object
          properties:
            error: {type: string}
            servers:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  source: {type: string, enum: [user, plugin]}
                  owner: {type: string}
                  state: {type: string, enum: [disabled, waiting-credentials, waiting-authorization, connecting, connected, reconnecting, stopping, failed]}
                  error: {type: string}
                  missing: {type: array, items: {type: string}}
                  toolCount: {type: integer}
                  resources: {type: boolean}
                  protocolVersion: {type: string}
                  serverName: {type: string}
                  oauthEnabled: {type: boolean, description: The plugin declared standard MCP OAuth for this connection.}
                  authorization: {$ref: '#/components/schemas/MCPOAuthAuthorization'}
    PluginSource:
      type: object
      required: [type, spec]
      properties:
        type: {type: string, enum: [registry, git, directory, tarball, bundled]}
        spec: {type: string, description: Fixed source snapshot resolved by the Controller and Host.}
        registry: {type: string}
        authRef: {type: string, description: Reference to an explicitly saved installation credential.}
        username: {type: string}
    PluginPackageInput:
      type: object
      additionalProperties: false
      required: [pluginId]
      properties:
        pluginId: {type: string, description: Stable ID from the Controller's built-in reviewed catalog.}
    PluginLocalized:
      type: object
      required: [en, zh-CN]
      properties:
        en: {type: string}
        zh-CN: {type: string}
    PluginCatalogEntry:
      type: object
      required: [pluginId, package, name, description, version, icon, maintainer, license]
      properties:
        pluginId: {type: string}
        package: {type: string}
        name: {type: string}
        description: {$ref: '#/components/schemas/PluginLocalized'}
        version: {type: string}
        icon: {type: string, description: Controller-relative image path declared by plugin.json}
        maintainer: {type: string}
        license: {type: string}
        tutorials:
          type: array
          items:
            type: object
            required: [language, title, video]
            properties:
              language: {type: string, enum: [en, zh-CN]}
              title: {type: string}
              video: {type: string, description: Backend-relative MP4 asset from plugin.json}
              poster: {type: string, description: Optional backend-relative poster image}
    PluginPackageInfo:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        description: {type: string}
        license: {type: string}
        source: {$ref: '#/components/schemas/PluginSource'}
        api: {type: string, enum: ['1']}
        title: {type: string}
        availableVersion: {type: string, description: Present only when the reviewed release is newer than the actual installed package.}
        configSchema: {type: object, additionalProperties: true}
        present: {type: boolean}
    PluginSettings:
      type: object
      additionalProperties: false
      required: [packages]
      properties:
        packages:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [catalogId, version, enabled]
            properties:
              catalogId: {type: string}
              version: {type: string}
              enabled: {type: boolean}
    PluginView:
      type: object
      required: [catalog, settings, status]
      properties:
        catalog: {type: array, items: {$ref: '#/components/schemas/PluginCatalogEntry'}}
        settings: {$ref: '#/components/schemas/PluginSettings'}
        status:
          type: object
          properties:
            runtime: {type: string, enum: [stopped, running, failed, unavailable]}
            packages: {type: array, items: {$ref: '#/components/schemas/PluginPackageInfo'}}
            instances:
              type: array
              items:
                type: object
                properties:
                  id: {type: string}
                  package: {type: string}
                  state: {type: string, enum: [ready, pending, loading, stopping, disposed, failed, disabled, unavailable]}
                  error: {type: string}
            error: {type: string}
    ScheduleEntry:
      type: object
      required: [record, status, scheduledAtLocal]
      properties:
        record:
          type: object
          required: [id, title, prompt, kind, scheduledAt]
          properties:
            id: {type: string}
            title: {type: string}
            prompt: {type: string}
            kind: {type: string, enum: [after, at, every, daily, weekly, cron, rrule]}
            scheduledAt: {type: string, format: date-time}
            afterSeconds: {type: integer}
            everySeconds: {type: integer}
            time: {type: string}
            timeZone: {type: string}
            weekdays: {type: array, items: {type: integer, minimum: 1, maximum: 7}}
            expression: {type: string}
            rrule: {type: string}
        status: {type: string, enum: [active, paused, ended]}
        sessionId: {type: string, description: Existing destination session}
        target: {$ref: "#/components/schemas/ScheduleTarget"}
        involvedSessionIds: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        scheduledAtLocal: {type: string, format: date-time}
        executionActive: {type: boolean}
        deliveryFloorEndsAt: {type: string, format: date-time}
        lastDelivery:
          type: object
          required: [scheduledAt, deliveredAt, messageId]
          properties:
            scheduledAt: {type: string, format: date-time}
            deliveredAt: {type: string, format: date-time}
            messageId: {type: string}
            targetSessionId: {type: string}
    ScheduleTarget:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [session, new_once, new]}
        sessionId: {type: string, description: Existing destination or a server-reserved new-once session ID in responses}
        create:
          type: object
          properties:
            cwd: {type: string}
            agentPreset: {type: string}
    ScheduleTiming:
      type: object
      required: [kind]
      description: Supply the one property matching kind. After and every use seconds.
      properties:
        kind: {type: string, enum: [after, at, every, daily, weekly, cron, rrule]}
        after_seconds: {type: integer, minimum: 1}
        every_seconds: {type: integer, minimum: 60}
        at:
          oneOf:
          - {type: string, format: date-time}
          - type: object
            required: [date, time, time_zone]
            properties:
              date: {type: string, format: date}
              time: {type: string}
              time_zone: {type: string}
        daily:
          type: object
          required: [time, time_zone]
          properties:
            time: {type: string}
            time_zone: {type: string}
        weekly:
          type: object
          required: [time, time_zone, weekdays]
          properties:
            time: {type: string}
            time_zone: {type: string}
            weekdays: {type: array, items: {type: integer, minimum: 1, maximum: 7}}
        cron:
          type: object
          required: [expression, time_zone]
          properties:
            expression: {type: string}
            time_zone: {type: string}
        rrule: {type: string}
    ToolProviderSettings:
      type: object
      required: [defaultProvider, provider, providers, entries, hasApiKey]
      properties:
        defaultProvider: {type: string}
        provider: {type: string}
        providers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
              defaultModel: {type: string}
        entries:
          type: object
          additionalProperties:
            type: object
            required: [hasApiKey]
            properties:
              hasApiKey: {type: boolean}
              model: {type: string}
        hasApiKey: {type: boolean}
    ModelEndpointInput:
      type: object
      properties:
        protocol:
          type: string
          enum: [responses, anthropic_messages]
          default: responses
          description: Endpoint API format; independent of the model name.
        name: {type: string}
        baseUrl: {type: string, format: uri}
        apiKey: {type: string, writeOnly: true}
        models:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ordered model IDs. The first model is the endpoint default.
          items: {type: string}
